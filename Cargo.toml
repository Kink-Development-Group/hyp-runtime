[workspace]
resolver = "2"
members = [
    "hypnoscript-core",
    "hypnoscript-lexer-parser",
    "hypnoscript-compiler",
    "hypnoscript-runtime",
    "hypnoscript-cli",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
authors = ["Kink Development Group"]
license = "MIT"
repository = "https://github.com/Kink-Development-Group/hyp-runtime"

[workspace.dependencies]
# Core dependencies shared across workspace
anyhow = "1.0"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "blocking", "query", "rustls"] }
csv = "1.4.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
