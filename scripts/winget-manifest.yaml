# winget-manifest.yaml
PackageIdentifier: HypnoScript.HypnoScript
PackageVersion: 1.3.0
PackageName: HypnoScript
Publisher: HypnoScript Project
License: MIT
Installers:
  - Architecture: x64
    InstallerType: zip
    InstallerUrl: https://github.com/Kink-Development-Group/hyp-runtime/releases/download/v1.3.0/HypnoScript-windows-x64.zip
    InstallerSha256: <SHA256>
    Scope: machine
    NestedInstallerType: exe
    NestedInstallerFiles:
      - RelativeFilePath: HypnoScript.CLI.exe
        PortableCommandAlias: hypnoscript
ShortDescription: HypnoScript CLI & Runtime
Description: HypnoScript is a modern, hypnotic programming language with CLI and runtime.
Tags:
  - HypnoScript
  - CLI
  - Runtime
